[project]
name = "alymarket"
version = "0.1.0"
description = "Plataforma de geração de leads B2B a partir de dados públicos de empresas (Brasil: CNPJ/Receita Federal; França: SIRENE/INSEE), com conformidade LGPD/RGPD."
readme = "CLAUDE.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "duckdb>=1.0",
    "polars>=1.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "streamlit>=1.35",
    "apscheduler>=3.10",
    "faker>=25.0",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[tool.poetry]
# O Streamlit Cloud detecta este pyproject.toml e roda `poetry install`. Sem isto,
# o Poetry tenta instalar "alymarket" como pacote e falha ("No file/folder found
# for package alymarket") porque o layout real é `src/` (ver
# [tool.setuptools.packages.find] abaixo), não um pacote `alymarket/`. Com
# package-mode = false, o Poetry só resolve/instala as dependências de [project]
# (suporte PEP 621) e não tenta empacotar/instalar o próprio projeto — os imports
# de `src/` continuam funcionando via `streamlit_app.py` na raiz (ver lá).
package-mode = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "cli"]

[tool.mypy]
python_version = "3.12"
files = ["src", "cli.py"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
